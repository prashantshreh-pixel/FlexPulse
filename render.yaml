services:
  - type: web
    name: flexpulse-workout-tracker
    runtime: docker
    plan: free
    autoDeploy: true
    branch: main
    healthCheckPath: /favicon.svg
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_USE_HTTPS
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "flexpulse.app,www.flexpulse.app,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://flexpulse.app,https://www.flexpulse.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://flexpulse.app,https://www.flexpulse.app"
